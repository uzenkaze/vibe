<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Carrep</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; }
    iframe { width: 100%; height: 100%; border: none; outline: none; }
  </style>
</head>
<body>
  <iframe id="carrepFrame" src="https://uzenkaze.github.io/vibe/carrep/"></iframe>
  <script>
    // 항상 최신 웹 소스로 렌더링되도록 캐시 무효화 타임스탬프 적용
    var frame = document.getElementById('carrepFrame');
    if (frame) {
      frame.src = "https://uzenkaze.github.io/vibe/carrep/?t=" + Date.now();
    }
  </script>
</body>
</html>
